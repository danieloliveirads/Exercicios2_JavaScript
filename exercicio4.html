<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
  
    <title>Exercício 4</title>
</head>
<body>
    <script>

var num1 = parseInt( prompt ("Digite um número:"));

if (num1 > 0) {
    let soma = 0;
    for (let i = 1; i <= num1; i++) {
        soma += i;
    }
    alert("A soma de 1 até " + num1 + " é: " + soma);
}

    </script>
    
</body>
</html>
