<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
  
    <title>Exercício 5</title>
</head>
<body>
    <script>

var num = parseInt( prompt ("Digite um número:"));

let divisores = 0;

for (let i = 1; i <= num; i++) {
    if (num % i === 0) {
        divisores++;
    }
}

if (divisores === 2) {
    alert(num + " é um número primo.");
} else {
    alert(num + " não é um número primo.");
}

    </script>
    
</body>
</html>
